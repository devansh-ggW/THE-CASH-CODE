name: Apply Cash Code motion polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[cash-code-motion]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace generic reveal motion
        shell: python
        run: |
          from pathlib import Path
          p = Path("THE_CASH_CODE_DEWIFY_SINGLE_FILE.html")
          s = p.read_text(encoding="utf-8")

          start = s.find(".reveal {")
          media = s.find("@media (max-width: 900px)", start)
          if start == -1 or media == -1:
              raise SystemExit("Reveal CSS markers not found")

          css = r'''/* Editorial reveal system: directional, layered, and deliberately not a generic fade-in. */
          .reveal {
            --reveal-y: 34px;
            --reveal-x: 0px;
            --reveal-scale: .975;
            --reveal-rotate: 0deg;
            opacity: 1;
          }
          body.has-js .reveal {
            opacity: 0;
            transform: translate3d(var(--reveal-x), var(--reveal-y), 0) scale(var(--reveal-scale)) rotate(var(--reveal-rotate));
            clip-path: inset(0 0 8% 0);
            filter: blur(7px);
            transition: opacity .85s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1), clip-path .95s cubic-bezier(.16,1,.3,1), filter .85s cubic-bezier(.16,1,.3,1);
            will-change: opacity, transform, clip-path, filter;
          }
          body.has-js .reveal.visible {
            opacity: 1;
            transform: translate3d(0,0,0) scale(1) rotate(0deg);
            clip-path: inset(0 0 0 0);
            filter: blur(0);
          }
          .hero-copy { --reveal-y: 44px; --reveal-x: -22px; --reveal-scale: .985; }
          .hero-book { --reveal-y: 28px; --reveal-x: 24px; --reveal-scale: .96; --reveal-rotate: 1.8deg; }
          .story-title { --reveal-y: 30px; --reveal-x: -18px; }
          .story-copy { --reveal-y: 30px; --reveal-x: 18px; }
          .statement { --reveal-y: 24px; --reveal-scale: .98; }
          .chapter-header { --reveal-y: 26px; }
          .chapter-list { --reveal-y: 30px; }
          .framework-card { --reveal-y: 24px; --reveal-scale: .985; }
          .preview-card { --reveal-y: 28px; --reveal-scale: .97; }
          .gaz-copy { --reveal-y: 30px; --reveal-x: -18px; }
          .back-cover-card { --reveal-y: 28px; --reveal-x: 18px; --reveal-scale: .965; --reveal-rotate: -1.5deg; }
          .buy-panel { --reveal-y: 34px; --reveal-scale: .985; }
          .delay-1 { transition-delay: .14s; }
          .delay-2 { transition-delay: .24s; }

          .book-cover-wrap { transition: transform .9s cubic-bezier(.16,1,.3,1); }
          .hero-book:hover .book-cover-wrap { transform: rotate(0deg) translateY(-7px); }
          .preview-card { transition: transform .65s cubic-bezier(.16,1,.3,1), box-shadow .65s ease; }
          .preview-card:hover { transform: translateY(-8px); box-shadow: 0 22px 50px rgba(37,32,22,.12); }

          @media (prefers-reduced-motion: reduce) {
            body.has-js .reveal { opacity: 1; transform: none; clip-path: none; filter: none; transition: none; }
            .book-cover-wrap, .preview-card { transition: none; }
          }

          '''

          s = s[:start] + css + s[media:]

          # Remove marquee CSS, if present.
          ms = s.find(".marquee-strip {")
          if ms != -1:
              me = s.find(".section-kicker", ms)
              if me != -1:
                  s = s[:ms] + s[me:]

          # Remove rendered marquee element, if present.
          ms = s.find('<div class="marquee-strip">')
          if ms != -1:
              me = s.find("</div>", ms)
              if me != -1:
                  s = s[:ms] + s[me + len("</div>"):]

          p.write_text(s, encoding="utf-8")

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THE_CASH_CODE_DEWIFY_SINGLE_FILE.html
          git rm .github/workflows/cash-code-motion.yml
          git diff --cached --quiet || git commit -m "Polish THE CASH CODE page transitions [cash-code-motion]"
          git push
